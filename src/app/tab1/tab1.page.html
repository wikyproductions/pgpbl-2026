<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      <ion-icon name="person-circle-outline"></ion-icon> Profil Mahasiswa
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid class="ion-height-full">
    <ion-row class="ion-justify-content-center ion-align-items-center ion-height-full">
      <ion-col size="12" size-md="8" size-lg="6">
        <ion-card class="ion-text-center">
          <ion-card-header class="ion-display-flex ion-flex-direction-column ion-align-items-center">
            <ion-avatar>
              <img src="./assets/icon/kacamata-kuda.jpg" alt="Foto Profil" />
            </ion-avatar>

            <ion-card-title class="ion-margin-top">Dwiky Surya Abdilah</ion-card-title>
            <ion-card-subtitle>24/537664/SV/24444</ion-card-subtitle>


          </ion-card-header>

          <ion-card-content>
            <ion-list lines="full">
              <ion-item>
                <ion-icon name="business-outline" slot="start" color="primary"></ion-icon>
                <ion-label class="ion-text-start">
                  <h3>Departemen</h3>
                  <p>Teknologi Kebumian</p>
                </ion-label>
              </ion-item>

              <ion-item>
                <ion-icon name="library-outline" slot="start" color="primary"></ion-icon>
                <ion-label class="ion-text-start">
                  <h3>Universitas</h3>
                  <p>Universitas Gadjah Mada</p>
                </ion-label>
              </ion-item>
            </ion-list>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
