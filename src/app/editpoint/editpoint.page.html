<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/maps"></ion-back-button>
    </ion-buttons>
    <ion-title>Edit Point</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div id="mapedit" style="width: 100%; height: 45vh"></div>

  <ion-list>
    <ion-item>
      <ion-input label="Name" labelPlacement="floating" [(ngModel)]="name" type="text"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Coordinates" labelPlacement="floating" [(ngModel)]="coordinates" type="text"></ion-input>
    </ion-item>
    <ion-item>
    <ion-input label="Description" labelPlacement="floating" [(ngModel)]="description"></ion-input>
  </ion-item>
  </ion-list>

  <div class="ion-padding">
    <ion-button expand="block" (click)="save()">Save</ion-button>
  </div>
</ion-content>
