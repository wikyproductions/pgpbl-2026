<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <ion-icon name="add-circle-outline"></ion-icon> Tambah Mata Kuliah
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">


  <ion-card>
  <ion-card-content>
     <ion-list>
    <ion-item>
      <ion-input label="Mata Kuliah" placeholder="Masukkan nama mata kuliah"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Waktu" placeholder="Masukkan waktu"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Dosen" placeholder="Masukkan nama dosen pengampu"></ion-input>
    </ion-item>
    <ion-item>
      <ion-input label="Ruang" placeholder="Masukkan nama ruang"></ion-input>
    </ion-item>
  </ion-list>

  <ion-button shape="round">Simpan</ion-button>
  </ion-card-content>
</ion-card>


</ion-content>
